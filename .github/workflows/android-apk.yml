# Builds the Android APK and hands it back as a downloadable file.
#
# The reason this exists rather than a line in a README: a build needs the
# Expo account that owns the project, and `eas build` is a CLI. The people who
# need this APK have phones. GitHub's "Run workflow" button is not a CLI — it
# is a button on a web page, and it works on a phone.
#
# ## Where the build actually runs — the `builder` input
#
# `local` (the default) runs the Android build on this GitHub runner, via
# `eas build --local`. `cloud` sends it to EAS's build farm, which is what
# this workflow originally did.
#
# The difference that matters: a cloud build consumes one of the Expo
# account's build credits, and those run out. A local build does not — the
# compute is GitHub's, which is free for public repositories and metered
# against Actions minutes for private ones (an Android build is roughly 20-30
# of them). When the Expo quota is exhausted, `local` is the one that still
# produces an APK today rather than after the quota resets.
#
# What `local` costs you: the EAS-hosted download link. A cloud build leaves
# the APK on EAS *and* on this run, deliberately, because those two fail in
# different ways — an artifact expires after 30 days and needs a GitHub login,
# an EAS link needs the build not to have been pruned. A local build only ever
# produces the GitHub artifact, so that second copy is not there to fall back
# on.
#
# `local` still signs the APK with the same EAS-managed keystore, fetched with
# EXPO_TOKEN — the signing identity does not change with the builder, so an
# app built either way installs as an update over the other.
#
# ## What you need once
#
#   EXPO_TOKEN        repository secret. expo.dev → Account settings →
#                     Access tokens → Create. Needed for both builders: even a
#                     local build fetches the signing keystore from EAS.
#
# The API address is a run-time input rather than stored, because it changes:
# a demonstration deployed today has a different URL than one deployed next
# month, and a stale value baked into a workflow builds an app that installs
# and reaches nothing.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API address the app will talk to, ending in /v1 (e.g. https://your-api-host/v1). Railway is the primary platform; take the value from the API service domain.'
        required: true
        type: string
      profile:
        description: 'preview = standalone. staging = standalone, app name visibly marked "TuTak (staging)". diagnostic = preview plus the on-screen event log. development = needs a Metro server on a computer.'
        required: true
        default: preview
        type: choice
        options: [preview, staging, diagnostic, development]
      builder:
        description: 'local = build here on the GitHub runner, spends no EAS build credit. cloud = build on EAS, spends one credit and also leaves a download link on expo.dev.'
        required: true
        default: local
        type: choice
        options: [local, cloud]

# Two builds of the same app at once would race for the same version code and
# waste build minutes on a result nobody wants.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `contents: write` is for the release step below, which produces the
    # only download link that works on a phone. The default token is
    # read-only, and nothing else here writes to the repository.
    permissions:
      contents: write
    steps:
      - name: Refuse early if the token is missing
        # Before anything is installed. Without this the run spends two
        # minutes on setup and then fails inside eas-cli with an
        # authentication message that reads like a bug rather than a missing
        # secret.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Settings → Secrets and variables → Actions → New repository secret. Create the token at expo.dev → Account settings → Access tokens."
            exit 1
          fi

      - name: Reject an address that cannot work on a phone
        # `localhost` on a phone is the phone. An APK built against it
        # installs, opens, looks correct and reaches nothing — and the person
        # holding it cannot tell that from a server being down. app.config.js
        # refuses this too; catching it here saves the queue.
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          case "$API_BASE_URL" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "::error::$API_BASE_URL points at the phone itself. Use an address the phone can reach."
              exit 1 ;;
          esac
          case "$API_BASE_URL" in
            */v1) : ;;
            *) echo "::error::$API_BASE_URL does not end in /v1 — every request would 404." ; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Java for the local Gradle build
        # Only the local builder compiles anything here; a cloud build ships
        # the source to EAS and never runs Gradle on this machine. The runner
        # image already carries a JDK and the Android SDK, but which JDK is
        # default moves between image releases, and Gradle failing on a JDK
        # it does not support is a twenty-minute build that dies in the last
        # phase. Pinned rather than inherited for that reason.
        if: inputs.builder == 'local'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link the EAS project
        # `eas init` cannot write into a dynamic config — it only edits
        # app.json — so on a fresh account it creates the project, prints the
        # id and leaves placing it to us. app.config.js reads EAS_PROJECT_ID,
        # so putting it in the environment is enough and nothing has to be
        # committed. `|| true` because a project that already exists makes
        # this a no-op that exits non-zero on some versions.
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          set +e
          if [ -n "$EAS_PROJECT_ID" ]; then
            echo "Using EAS_PROJECT_ID from repository variables"
            echo "EAS_PROJECT_ID=$EAS_PROJECT_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -f eas-project.json ]; then
            echo "Using apps/mobile/eas-project.json"
            exit 0
          fi
          echo "No project id configured — asking EAS to create or link one"
          npx eas-cli@latest init --non-interactive --force 2>&1 | tee /tmp/init.log
          ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/init.log | head -1)
          if [ -n "$ID" ]; then
            echo "Linked project $ID"
            echo "EAS_PROJECT_ID=$ID" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not determine the EAS project id automatically; the build step will report what is missing."
          fi

      - name: Put the address where the build can see it
        # The one that cost two failed builds. Setting API_BASE_URL on this
        # job is enough for the CLI to read app.config.js *here*, so the
        # bundle uploads and everything looks fine — and then EAS re-reads the
        # same config on its own machine, where this job's environment does
        # not exist. app.config.js refuses to produce a preview build without
        # an address, so the build died in the "Read app config" phase with
        # nothing but "Unknown error" to show for it.
        #
        # What crosses that boundary is the build profile's `env` block in
        # eas.json. The value is a run-time input, so it is written in here
        # rather than committed: a URL baked into the repository is stale the
        # next time the demonstration moves.
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -e
          tmp=$(mktemp)
          jq --arg p "$PROFILE" --arg url "$API_BASE_URL" \
            '.build[$p].env.API_BASE_URL = $url' eas.json > "$tmp"
          mv "$tmp" eas.json
          # The project id crosses the same boundary and was making the same
          # trip on the same missing bus: the builder logged
          # "extra.eas.projectId is missing" while this job had it in its
          # environment the whole time.
          if [ -n "$EAS_PROJECT_ID" ]; then
            tmp=$(mktemp)
            jq --arg p "$PROFILE" --arg id "$EAS_PROJECT_ID" \
              '.build[$p].env.EAS_PROJECT_ID = $id' eas.json > "$tmp"
            mv "$tmp" eas.json
          fi
          echo "Profile that will be built:"
          jq --arg p "$PROFILE" '.build[$p]' eas.json
          # EAS takes the project from git, so a change left only in the
          # working tree may not reach the builder. This commit exists for the
          # length of this job and is never pushed anywhere.
          git -c user.email=actions@github.com -c user.name='GitHub Actions' \
            commit -q -m "ci: point $PROFILE at $API_BASE_URL" -- eas.json
          echo "eas.json committed locally for this build only"

      - name: Read the app config the way EAS will read it
        # Deliberately hostile: it throws away this job's environment and
        # keeps only what the build profile carries, which is exactly what the
        # builder gets. If app.config.js is going to refuse, it refuses here
        # in five seconds instead of twenty minutes into a queued cloud build
        # whose error message names a phase and nothing else.
        working-directory: apps/mobile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -e
          # Only the profile's own variables — API_BASE_URL is deliberately
          # not set on this step.
          eval "$(jq -r --arg p "$PROFILE" \
            '.build[$p].env // {} | to_entries[] | "export \(.key)=\(.value|@sh)"' eas.json)"
          echo "APP_ENV=$APP_ENV"
          echo "API_BASE_URL=$API_BASE_URL"
          npx expo config --type public --json > /dev/null
          echo "app config reads cleanly with only the profile's environment"

      - name: Build the APK here
        id: build_local
        if: inputs.builder == 'local'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          APP_ENV: ${{ inputs.profile }}
        # `--local` runs the same build EAS would run, on this runner, and
        # spends no build credit. `--output` names the file directly, which is
        # why the cloud path's download step has no local equivalent: there is
        # nothing to fetch, the APK is already on disk where the upload step
        # expects it.
        #
        # No `--json` here: that flag describes a *build record* on EAS, and a
        # local build does not create one. A failure prints Gradle's own
        # output into this job's log, which is more use than a record id
        # anyway.
        run: |
          set -o pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --local \
            --non-interactive \
            --output "$PWD/tutak.apk"

      - name: Build the APK on EAS
        id: build
        if: inputs.builder == 'cloud'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          APP_ENV: ${{ inputs.profile }}
        # --json puts the build record on stdout and the progress on stderr,
        # so the artifact URL can be read without scraping a progress bar.
        # --wait so the job does not report success while the build is queued.
        run: |
          set -o pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait \
            --json > build.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)
          APK_URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // empty' build.json)
          PAGE=$(jq -r '.[0].id // empty' build.json)
          echo "apk_url=${APK_URL:-$BUILD_URL}" >> "$GITHUB_OUTPUT"
          echo "build_id=$PAGE" >> "$GITHUB_OUTPUT"
          if [ -z "${APK_URL:-$BUILD_URL}" ]; then
            echo "::error::EAS finished but reported no artifact. Full record:"
            cat build.json
            exit 1
          fi

      - name: Say why EAS failed
        # A build that fails on EAS leaves the CLI printing "Build failed" and
        # a link — which is no use to somebody reading this from a phone, and
        # no use at all if the link is unreachable from where they are. The
        # record holds the phase that failed and the message; print it here so
        # the run explains itself.
        if: failure() && inputs.builder == 'cloud' && steps.build.outcome == 'failure'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "=== what EAS recorded about the most recent build ==="
          npx eas-cli@latest build:list --limit 1 --json --non-interactive > record.json 2>/dev/null || true
          cat record.json || true
          echo ""
          echo "=== the build's own logs ==="
          # The record carries signed URLs to the log files. Printing them
          # here is the difference between "Unknown error, see the logs" and
          # knowing which line of app.config.js threw — which matters because
          # the person reading this may have no way to open expo.dev.
          for url in $(jq -r '.[0].logFiles[]? // empty' record.json 2>/dev/null); do
            echo "--- $url"
            # --compressed: these are stored brotli-compressed, and without it
            # curl prints the compressed bytes, which is how the first attempt
            # at reading them produced a screenful of noise.
            # Each line is a JSON record; the message is the only part worth
            # reading here.
            curl --fail --silent --location --compressed "$url" \
              | jq -r 'select(.msg) | "\(.phase // "?"): \(.msg)"' 2>/dev/null \
              | tail -n 120 \
              || echo "(could not fetch or parse)"
          done
          echo ""
          echo "=== the CLI's own output, if any ==="
          cat build.json 2>/dev/null || echo "(no build.json — the CLI exited before writing one)"

      - name: Download the APK
        # Cloud only: a local build already wrote apps/mobile/tutak.apk, which
        # is the same path the upload step below takes either way.
        if: inputs.builder == 'cloud'
        working-directory: apps/mobile
        env:
          APK_URL: ${{ steps.build.outputs.apk_url }}
        # Fetched here rather than left on EAS so it lands on the run page as
        # a file. `--fail` so a 404 is an error rather than an HTML page
        # saved with an .apk extension, which installs as nothing and
        # explains itself to nobody.
        run: |
          curl --fail --location --output tutak.apk "$APK_URL"
          ls -la tutak.apk
          file tutak.apk || true
          # An APK is a zip. If this is not one, something upstream handed us
          # a redirect page and the artifact would be useless on a phone.
          if ! head -c 2 tutak.apk | grep -q 'PK'; then
            echo "::error::What was downloaded is not an APK."
            head -c 400 tutak.apk
            exit 1
          fi

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: tutak-android-${{ inputs.profile }}
          path: apps/mobile/tutak.apk
          if-no-files-found: error
          retention-days: 30

      # ── The link that actually works on a phone ────────────────────────
      #
      # An Actions artifact is the wrong shape for the person who needs it.
      # It is a ZIP, so the phone has to unpack it before Android will look
      # at the APK; the tile that downloads it is frequently not tappable in
      # GitHub's mobile web UI; and it expires after 30 days.
      #
      # A release asset is a plain `.apk` at a stable URL: one tap downloads
      # it and Android opens the installer directly. The artifact upload
      # above stays — the two fail in different ways, and a build should not
      # become undownloadable because a release could not be cut.
      - name: Publish the APK as a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ inputs.profile }}-${{ github.run_number }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          notes="Commit \`$GITHUB_SHA\`. Talks to \`$API_BASE_URL\`.

          Open this page on the Android phone and tap **tutak.apk** below.
          Android will ask permission to install from this source, which is
          expected for an app that did not come from Play."
          gh release create "$TAG" apps/mobile/tutak.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TuTak Android — ${{ inputs.profile }} #${{ github.run_number }}" \
            --notes "$notes"
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Where to get it
        if: always()
        env:
          APK_URL: ${{ steps.build.outputs.apk_url }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "## The APK"
            echo ""
            if [ -n "${RELEASE_URL:-}" ]; then
              echo "### Download it on the phone"
              echo ""
              echo "**[$RELEASE_URL]($RELEASE_URL)** — open on the Android device and tap \`tutak.apk\`."
              echo "One tap, nothing to unpack."
              echo ""
            fi
            if [ "${{ steps.build_local.outcome }}" = "success" ]; then
              echo "Built on this runner — no EAS build credit was spent, and there is no copy on expo.dev."
              echo ""
              echo "**On this page:** scroll to **Artifacts** and download **tutak-android-${{ inputs.profile }}**."
            elif [ -n "$APK_URL" ]; then
              echo "**On this page:** scroll to **Artifacts** and download **tutak-android-${{ inputs.profile }}**."
              echo ""
              echo "**Direct from EAS:** [$APK_URL]($APK_URL)"
              echo ""
              echo "Build id: \`$BUILD_ID\`"
            else
              echo "No artifact was produced — the build step above says why."
            fi
            echo ""
            echo "### Installing on the phone"
            echo ""
            echo "Open the link on the Android device and tap the downloaded file."
            echo "Android will ask permission to install from this source; that is expected for an app that did not come from Play."
            echo ""
            echo "This build talks to \`${{ inputs.api_base_url }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
