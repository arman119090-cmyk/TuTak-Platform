# Cash Out lives in cash-out/ only until it moves to its own repository.
# This workflow exists so that, meanwhile, its checks actually run on GitHub:
# the copy at cash-out/.github/workflows/ci.yml is the one that takes over the
# day the directory becomes a repository root, and it is identical except that
# it has no `paths:` filter and no `working-directory`.
name: Cash Out CI

on:
  push:
    paths:
      - 'cash-out/**'
      - '.github/workflows/cash-out-ci.yml'
  pull_request:
    paths:
      - 'cash-out/**'
      - '.github/workflows/cash-out-ci.yml'

concurrency:
  group: cash-out-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cash-out

jobs:
  verify:
    name: Install, migrate, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cashout
          POSTGRES_PASSWORD: cashout
          POSTGRES_DB: cashout_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cashout -d cashout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Test-only values for the ephemeral service container. Nothing secret.
      DATABASE_URL: postgresql://cashout:cashout@localhost:5432/cashout_test?schema=public
      TEST_DATABASE_URL: postgresql://cashout:cashout@localhost:5432/cashout_test?schema=public
      API_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cash-out/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @cashout/api exec prisma generate

      # A clean database, every migration in order, including the one that
      # installs the append-only triggers and the partial unique indexes the
      # schema file cannot express.
      - name: Migrations on a clean PostgreSQL
        run: pnpm --filter @cashout/api exec prisma migrate deploy

      - name: Build shared packages
        run: pnpm -r --filter "./packages/*" build

      - name: Typecheck (api, admin, mobile, packages)
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      # Unit tests and integration tests against the real database above.
      - name: Tests
        run: pnpm -r test

      - name: Admin build
        run: pnpm --filter @cashout/admin build

      # There is no simulator on a runner; what can be checked is that the
      # app's TypeScript is sound and its Expo config resolves.
      - name: Mobile checks
        run: |
          pnpm --filter @cashout/mobile typecheck
          pnpm --filter @cashout/mobile exec expo config --type public > /dev/null
