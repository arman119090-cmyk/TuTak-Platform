name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only credentials for the ephemeral service container below. Nothing
  # here is a secret; real deployments read these from the environment.
  TEST_DATABASE_URL: postgresql://tutak:tutak_ci_password@localhost:5432/tutak_test?schema=public
  DATABASE_URL: postgresql://tutak:tutak_ci_password@localhost:5432/tutak_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-continuous-integration
  JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-continuous-integration

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    # The integration suite runs against real PostgreSQL rather than a mock:
    # the guarantees under test (transaction atomicity, Serializable conflict
    # detection, CHECK constraints, unique indexes) exist in the database, and
    # a mocked client would pass while production corrupted balances.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutak
          POSTGRES_PASSWORD: tutak_ci_password
          POSTGRES_DB: tutak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tutak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tutak/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests need no database, so a failure here is unambiguous.
      - name: Unit tests
        run: pnpm --filter @tutak/api test:unit

      # globalSetup creates tutak_test, applies the full migration history,
      # and runs VALIDATE CONSTRAINT on bonus_ledger_delta_matches_direction.
      # That constraint ships NOT VALID to grandfather pre-existing rows in
      # long-lived databases; on a database built from scratch it must hold
      # universally, so this step proves no code path can write a ledger entry
      # whose deltas contradict its direction.
      - name: Integration tests
        run: pnpm --filter @tutak/api test:int

      - name: Mobile tests
        run: pnpm --filter @tutak/mobile test

      - name: Admin dashboard tests
        run: pnpm --filter @tutak/admin test

      - name: Partner dashboard tests
        run: pnpm --filter @tutak/partner test

      - name: Build all applications
        run: pnpm build

  # The demo stack is only a real deliverable if the images actually build.
  # This job is the proof: it builds all three Dockerfiles the same way
  # `scripts/demo-up.sh` does. It does not push anything — publishing is
  # docker-publish.yml's job, and only from the default branch.
  docker:
    name: Build the container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Needed by the end-to-end step at the bottom, which runs on the runner
      # rather than inside a container.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          # Loaded into the daemon under the name Compose derives for
          # this service, so the boot step below runs these exact
          # images instead of building them a second time.
          load: true
          tags: tutak-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          # Loaded into the daemon under the name Compose derives for
          # this service, so the boot step below runs these exact
          # images instead of building them a second time.
          load: true
          tags: tutak-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Partner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/partner/Dockerfile
          push: false
          # Loaded into the daemon under the name Compose derives for
          # this service, so the boot step below runs these exact
          # images instead of building them a second time.
          load: true
          tags: tutak-partner:latest
          cache-from: type=gha,scope=partner
          cache-to: type=gha,mode=max,scope=partner

      # Booting the stack is a different failure mode from building it: a
      # missing runtime dependency, a bad entrypoint or a service that cannot
      # reach Postgres all pass the build and fail here.
      - name: Boot the whole stack and seed it
        run: |
          cat > .env <<'ENVFILE'
          JWT_ACCESS_SECRET=ci-access-secret-not-used-outside-continuous-integration
          JWT_REFRESH_SECRET=ci-refresh-secret-not-used-outside-continuous-integration
          DEMO_PASSWORD=CiDemoPassword-2026!
          ENVFILE
          docker compose up -d
          for i in $(seq 1 90); do
            [ "$(docker compose ps --format '{{.Health}}' api | head -1)" = healthy ] && break
            [ "$i" = 90 ] && { docker compose logs; exit 1; }
            sleep 2
          done
          docker compose exec -T -e SEED_ADMIN_PASSWORD='CiDemoPassword-2026!' \
            api node dist/scripts/seed-baseline.js
          docker compose exec -T -e TUTAK_DEMO=1 -e DEMO_PASSWORD='CiDemoPassword-2026!' \
            api node dist/scripts/seed-demo.js
          curl -fsS http://localhost:4000/health/ready
          curl -fsS -o /dev/null http://localhost:3000/login
          curl -fsS -o /dev/null http://localhost:3001/login

      # The suite drives the dashboards in a browser against the stack that
      # was just built and seeded. It is the only check that covers the
      # dashboards and the API together — everything above tests one side or
      # the other.
      - name: End-to-end tests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          DEMO_PASSWORD='CiDemoPassword-2026!' pnpm e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 100
