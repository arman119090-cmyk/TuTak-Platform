name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only credentials for the ephemeral service container below. Nothing
  # here is a secret; real deployments read these from the environment.
  TEST_DATABASE_URL: postgresql://tutak:tutak_ci_password@localhost:5432/tutak_test?schema=public
  DATABASE_URL: postgresql://tutak:tutak_ci_password@localhost:5432/tutak_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-continuous-integration
  JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-continuous-integration

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    # The integration suite runs against real PostgreSQL rather than a mock:
    # the guarantees under test (transaction atomicity, Serializable conflict
    # detection, CHECK constraints, unique indexes) exist in the database, and
    # a mocked client would pass while production corrupted balances.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutak
          POSTGRES_PASSWORD: tutak_ci_password
          POSTGRES_DB: tutak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tutak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tutak/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Reported, not enforced — and that is a decision rather than laziness.
      # Every advisory the last review turned up was either a build-time
      # dependency of the mobile app (`image-size`, `uuid`, reached only by
      # Metro and the Xcode project writer) or `js-yaml` under Swagger, which
      # `main.ts` disables in production. None of them sit on a request path
      # in a deployment. A gate that fails on those trains everyone to ignore
      # a red build, which costs more than it saves. What this step does buy
      # is that a genuinely new advisory appears in the run summary the day it
      # is published rather than the day somebody thinks to look — and if one
      # ever lands in an API production dependency, this is where it shows up
      # first and the gate becomes worth arguing about.
      - name: Dependency audit (advisory only)
        continue-on-error: true
        run: pnpm audit --audit-level moderate

      # Unit tests need no database, so a failure here is unambiguous.
      - name: Unit tests
        run: pnpm --filter @tutak/api test:unit

      # globalSetup creates tutak_test, applies the full migration history,
      # and runs VALIDATE CONSTRAINT on bonus_ledger_delta_matches_direction.
      # That constraint ships NOT VALID to grandfather pre-existing rows in
      # long-lived databases; on a database built from scratch it must hold
      # universally, so this step proves no code path can write a ledger entry
      # whose deltas contradict its direction.
      # timeout-minutes is a deliberate diagnostic addition (2026-08-18): this
      # step hung twice in a row for the full default 6-hour job timeout with
      # no logs available until it was killed. --verbose makes Jest print each
      # test as it finishes, so a future hang's log shows the last test that
      # completed rather than silence; the timeout turns "wait 6 hours for
      # nothing" into "fail in ~15 minutes with something to read" — baseline
      # for this step is ~4 minutes, so 15 leaves real headroom for CI
      # slowness without re-creating the multi-hour bleed.
      - name: Integration tests
        timeout-minutes: 15
        run: pnpm --filter @tutak/api test:int:verbose

      # Applying every migration in order (just above) only proves the
      # migration history is internally consistent — it says nothing about
      # whether `schema.prisma` itself still matches what that history
      # produces. Editing the schema file without running `prisma migrate
      # dev` to generate the matching migration is the classic way those two
      # drift apart, and nothing before this step would have caught it: the
      # app would keep working locally (Prisma Client is generated from
      # schema.prisma directly) right up until a real deploy applied the
      # migration history and got a database shaped differently from what
      # the code assumes. `tutak_test` already has the full history applied
      # from the step above, so this diffs that live result against the
      # schema file with no separate shadow database needed.
      - name: Migration drift check
        run: |
          cd apps/api
          if ! pnpm exec prisma migrate diff \
            --from-url "$TEST_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code; then
            echo "::error::schema.prisma does not match what prisma/migrations produces." \
              "Run 'pnpm --filter @tutak/api prisma:generate' after adding a migration for" \
              "every schema.prisma change, then commit the migration."
            exit 1
          fi

      - name: Mobile tests
        run: pnpm --filter @tutak/mobile test

      # `demo/` is a generated copy of the mobile app with the workspace
      # taken out, so that somebody can download the repository as a ZIP and
      # run `npm install && npx expo start` with nothing else installed. A
      # generated copy that nobody regenerates is a copy that lies, and the
      # person who finds out is the one who was given it. So: regenerate, and
      # fail if the result differs from what is committed.
      - name: The demo app matches the app it was generated from
        run: |
          scripts/build-demo-app.sh
          if ! git diff --quiet -- demo; then
            echo "demo/ is out of date. Run scripts/build-demo-app.sh and commit the result."
            git diff --stat -- demo
            exit 1
          fi
          # An untracked file means a new source file never reached the copy.
          if [ -n "$(git status --porcelain -- demo)" ]; then
            echo "demo/ has files that are not committed:"
            git status --porcelain -- demo
            exit 1
          fi

      - name: Admin dashboard tests
        run: pnpm --filter @tutak/admin test

      - name: Partner dashboard tests
        run: pnpm --filter @tutak/partner test

      - name: Build all applications
        run: pnpm build

  # The demo stack is only a real deliverable if the images actually build.
  # This job is the proof: it builds all three Dockerfiles the same way
  # `scripts/demo-up.sh` does. It does not push anything — publishing is
  # docker-publish.yml's job, and only from the default branch.
  docker:
    name: Build the container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Needed by the end-to-end step at the bottom, which runs on the runner
      # rather than inside a container.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          # Loaded into the daemon under the name Compose derives for
          # this service, so the boot step below runs these exact
          # images instead of building them a second time.
          load: true
          tags: tutak-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          # Loaded into the daemon under the name Compose derives for
          # this service, so the boot step below runs these exact
          # images instead of building them a second time.
          load: true
          tags: tutak-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Partner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/partner/Dockerfile
          push: false
          # Loaded into the daemon under the name Compose derives for
          # this service, so the boot step below runs these exact
          # images instead of building them a second time.
          load: true
          tags: tutak-partner:latest
          cache-from: type=gha,scope=partner
          cache-to: type=gha,mode=max,scope=partner

      # Booting the stack is a different failure mode from building it: a
      # missing runtime dependency, a bad entrypoint or a service that cannot
      # reach Postgres all pass the build and fail here.
      - name: Boot the whole stack and seed it
        run: |
          cat > .env <<'ENVFILE'
          JWT_ACCESS_SECRET=ci-access-secret-not-used-outside-continuous-integration
          JWT_REFRESH_SECRET=ci-refresh-secret-not-used-outside-continuous-integration
          DEMO_PASSWORD=CiDemoPassword-2026!
          DEMO_MODE=true
          CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:8099
          ENVFILE
          docker compose up -d
          for i in $(seq 1 90); do
            [ "$(docker compose ps --format '{{.Health}}' api | head -1)" = healthy ] && break
            [ "$i" = 90 ] && { docker compose logs; exit 1; }
            sleep 2
          done
          docker compose exec -T -e SEED_ADMIN_PASSWORD='CiDemoPassword-2026!' \
            api node dist/scripts/seed-baseline.js
          docker compose exec -T -e TUTAK_DEMO=1 -e DEMO_PASSWORD='CiDemoPassword-2026!' \
            api node dist/scripts/seed-demo.js
          curl -fsS http://localhost:4000/health/ready
          curl -fsS -o /dev/null http://localhost:3000/login
          curl -fsS -o /dev/null http://localhost:3001/login

      # The suite drives the dashboards in a browser against the stack that
      # was just built and seeded. It is the only check that covers the
      # dashboards and the API together — everything above tests one side or
      # the other.
      - name: End-to-end tests
        id: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          DEMO_PASSWORD='CiDemoPassword-2026!' pnpm e2e

      # Everything above this line tests the mobile app's source with the
      # network mocked. Nothing built it and let it talk to a server, and a
      # bug lived in that gap: the client read the demo probe one level
      # shallower than the envelope the API sends, so the demo sign-in button
      # never appeared on any deployment. The request succeeded, so nothing
      # threw and no test failed.
      #
      # This bundles the app the way a release bundles it and drives the
      # result against the stack already running above. react-native-web is
      # not Android — it shares the screens, stores and API client, not the
      # native modules or the keyboard — so this covers the client's own
      # logic and is not a substitute for installing an APK.
      - name: Drive the built mobile app against the stack
        run: |
          scripts/mobile-web-serve.sh http://localhost:4000/v1 8099 > mobile-web.log 2>&1 &
          # Ready means "the app is on this port", not "something answered".
          #
          # A 200 was the whole check, and a 200 is what a directory listing
          # returns. `http-server` was being given the export directory after
          # `--silent`, which takes it as that flag's value rather than as the
          # root, so it fell back to its default root — `./public`, which in
          # this repository holds two legal pages. The readiness loop passed on
          # the first try, the browser opened a file listing, and the failure
          # was reported as "the demo entry never appeared". Every run of this
          # step since it was added had been driving that listing.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8099/ | grep -q '<title>TuTak</title>'; then break; fi
            # Bundling is the slow half and the half that fails. Its log is
            # the only place that says why, so print it rather than reporting
            # a timeout with no cause.
            if [ "$i" = 60 ]; then
              echo "the mobile bundle never came up, or what came up was not the app:"
              curl -fsS http://localhost:8099/ | head -20 || true
              cat mobile-web.log
              exit 1
            fi
            sleep 5
          done
          # Asserted before the browser opens, because a failure here is a
          # stack problem and looks identical to a client problem once it
          # reaches Playwright. The last time this step went red the cause was
          # `DEMO_PASSWORD` never reaching the api container, and the visible
          # symptom was a button that did not do anything.
          echo "--- what the app will be told ---"
          curl -fsS http://localhost:4000/health
          echo
          curl -fsS -o /dev/null -w 'demo-session: %{http_code}\n' \
            -X POST http://localhost:4000/v1/auth/demo-session \
            -H 'Content-Type: application/json' -d '{"deviceId":"ci-preflight"}'

          # Written to a file and summarised on failure. Playwright's own
          # output is fine; the problem is that everything after this step —
          # container logs, three buildx post-jobs — pushes it out of the part
          # of the log anybody reads. Two rounds were spent not being able to
          # see which assertion failed.
          set +e
          MOBILE_WEB_URL=http://localhost:8099 DEMO_PASSWORD='CiDemoPassword-2026!' \
            pnpm exec playwright test --config tests/e2e/playwright.config.ts \
              --project=e2e --no-deps mobile-demo 2>&1 | tee playwright-mobile.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E '✘|Error:|expect\(|Timeout:|Received|unexpected value' \
              playwright-mobile.log | head -12 | sed 's/\x1b\[[0-9;]*m//g')

            echo "=============== why the mobile drive failed ==============="
            printf '%s\n' "$summary"
            echo "=============== end ======================================="

            # Also as an annotation. The step log is not a reliable place to
            # read this from: three buildx post-jobs and an artifact upload
            # run after any failure and push the assertion past the end of
            # what the API and the web UI show without scrolling. An
            # annotation is attached to the check itself and is the same two
            # lines however long the job log gets. Newlines encoded as %0A,
            # which is how the workflow-command syntax carries them.
            printf '::error title=mobile-demo failed::%s\n' \
              "$(printf '%s' "$summary" | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$status"

      # A backup script nobody has run is not a backup script. The stack is
      # already up and seeded, so this costs seconds and proves the dump is
      # restorable into a ledger that still balances.
      - name: Backup and restore rehearsal
        run: |
          docker compose exec -T postgres pg_dump --format=custom --compress=9 \
            --no-owner --no-privileges -U tutak -d tutak -f /tmp/ci.dump
          docker compose exec -T postgres pg_restore --list /tmp/ci.dump \
            | grep -q 'TABLE DATA public ledger_postings '
          docker compose exec -T postgres psql -U tutak -d postgres -q \
            -c 'CREATE DATABASE tutak_restore_check'
          docker compose exec -T postgres pg_restore --no-owner --no-privileges \
            -U tutak -d tutak_restore_check /tmp/ci.dump
          docker compose exec -T postgres psql -U tutak -d tutak_restore_check -tAc \
            "SELECT CASE WHEN COALESCE(SUM(balance),0) = 0 THEN 'balanced' ELSE 'DRIFT' END FROM ledger_accounts" \
            | grep -qx balanced
          echo "restore rehearsal passed: the dump restores into a ledger that balances"

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Only when the *stack* is what failed.
      #
      # This used to run on any failure, and it is the reason four rounds were
      # spent unable to read why the mobile step went red: even trimmed, five
      # services' worth of boot output is printed after the failing step and
      # pushes the failing assertion out of the end of the log, which is where
      # anybody looks first. Container logs diagnose a container problem; when
      # the browser is what failed, they are noise standing in front of the
      # answer.
      - name: Stack logs on failure
        if: failure() && steps.e2e.outcome == 'failure'
        run: docker compose logs --tail 25
