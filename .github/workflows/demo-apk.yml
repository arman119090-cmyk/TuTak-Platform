# Builds the demonstration app as an installable Android APK.
#
# ## Why this is separate from android-apk.yml
#
# That workflow builds the product, and the product needs an API address —
# a build of it without one installs, opens and reaches nothing. Standing up
# that API is a real piece of work with hosting, a database and a carrier
# behind it.
#
# This builds `demo/`, which answers every request from its own memory. No
# server, no database, no SMS. It is the app somebody taps through to decide
# whether the product is right, and it can exist today rather than after the
# infrastructure does.
#
# ## Why it cannot be mistaken for the product
#
# `demo/` is generated by scripts/build-demo-app.sh and is a separate
# application in every way that a phone can tell: it is called **TuTak Demo**,
# its android package is `am.tutak.demo` against the product's `am.tutak.app`,
# and its URL scheme is `tutakdemo`. Both can be installed at once and neither
# can overwrite the other.
#
# That separation is the point rather than tidiness. This app accepts any
# credentials — that is safe in something plainly labelled a demonstration and
# is an authentication bypass in anything installed as TuTak. The product's own
# config refuses to build with mocks at all (apps/mobile/app.config.js), so the
# two can only ever be built by two different paths.
#
# ## What you need once
#
#   EXPO_TOKEN   repository secret, the same one android-apk.yml uses.
name: Build demo APK

on:
  workflow_dispatch:

# Needed to publish the APK as a release asset.
permissions:
  contents: write

concurrency:
  group: demo-apk
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (demo APK)
    runs-on: ubuntu-latest
    # 60 was not enough. The first build of a new EAS project has no cache and
    # waits in the free tier's queue behind whatever else that account has
    # running — which on the first attempt was another build of this
    # repository's own, started minutes earlier. The job died at the timeout
    # with the APK still compiling on Expo's side, which reads like a failure
    # and is only a deadline.
    timeout-minutes: 120
    steps:
      - name: Refuse early if the token is missing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenerated rather than taken from the commit, so the APK is built from
      # whatever apps/mobile currently says. A demo that lags the app it
      # demonstrates is worse than no demo — that gap has already shipped once,
      # when demo/ was still carrying a keyboard bug the app had been fixed of.
      - name: Regenerate the demo app from the current source
        run: |
          pnpm install --frozen-lockfile
          scripts/build-demo-app.sh

      - name: Install the demo app's own dependencies
        working-directory: demo
        run: npm install --no-audit --no-fund

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `eas init` can write into a static app.json, which this app has — so
      # unlike the product's dynamic config, the project id needs no
      # environment variable and nothing has to be committed.
      - name: Link the EAS project
        working-directory: demo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --non-interactive --force || true

      # A cancelled job does not cancel the build. The first attempt hit the
      # 60-minute job timeout while EAS was still compiling; EAS carried on and
      # very likely finished minutes later, with the artifact sitting there and
      # nobody asking for it. Starting a fresh build in that situation queues
      # behind the free tier again and costs another half hour for a file that
      # already exists.
      #
      # So: look first. Only a build that FINISHED and carries an artifact is
      # reused, and its id and commit are printed so the reuse is visible
      # rather than assumed.
      - name: Reuse a finished build if EAS already has one
        id: existing
        working-directory: demo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build:list --platform android --limit 5 \
            --non-interactive --json > list.json 2>/dev/null || echo '[]' > list.json
          node -e "
            let builds = [];
            try { builds = require('./list.json'); } catch { builds = []; }
            if (!Array.isArray(builds)) builds = [];
            const done = builds.find(b =>
              b.status === 'FINISHED' &&
              (b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl));
            if (done) {
              const url = done.artifacts.buildUrl || done.artifacts.applicationArchiveUrl;
              console.log('Reusing build ' + done.id + ' from commit ' + (done.gitCommitHash || 'unknown'));
              console.log('APK_URL: ' + url);
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'apk_url=' + url + '\n');
            } else {
              console.log('No finished build to reuse; one will be started.');
            }
          "

      - name: Build the APK on EAS
        if: steps.existing.outputs.apk_url == ''
        id: build
        working-directory: demo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          npx eas-cli@latest build \
            --platform android --profile preview \
            --non-interactive --wait --json > build.json 2> build.err || {
              echo "::error::EAS refused or failed the build:"
              tail -40 build.err
              exit 1
            }
          URL=$(node -e "const b=require('./build.json');const r=Array.isArray(b)?b[0]:b;process.stdout.write(r.artifacts?.buildUrl||r.artifacts?.applicationArchiveUrl||'')")
          ID=$(node -e "const b=require('./build.json');const r=Array.isArray(b)?b[0]:b;process.stdout.write(r.id||'')")
          echo "APK_URL: $URL"
          echo "BUILD_ID: $ID"
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      # Either source: a build started here, or one EAS already had.
      - name: Settle on one URL
        id: apk
        run: |
          URL="${{ steps.build.outputs.apk_url }}"
          [ -n "$URL" ] || URL="${{ steps.existing.outputs.apk_url }}"
          echo "APK_URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download the APK
        if: steps.apk.outputs.url != ''
        run: curl -fL -o tutak-demo.apk "${{ steps.apk.outputs.url }}"

      - name: Attach the APK to this run
        if: steps.apk.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: tutak-demo-apk
          path: tutak-demo.apk
          retention-days: 30

      # A release asset, because the other two routes both failed for the
      # person who needs the file.
      #
      # The EAS link is on expo.dev, which is not reachable everywhere and is
      # blocked outright from some networks. The Actions artifact is a .zip
      # behind a GitHub login, which on a phone means signing in and then
      # unpacking an archive. A release asset is a plain file on github.com
      # with no login at all — the one host that is reachable if any of this
      # is.
      #
      # A single moving tag rather than a version per build: the point is a
      # link that keeps working, not a history of demonstrations.
      - name: Publish the APK where a phone can actually reach it
        if: steps.apk.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes written to a file rather than inlined: a multi-line --notes
          # argument inside a YAML block scalar ends the block at the first
          # blank line, which is a broken workflow rather than a broken
          # release.
          cat > notes.md <<'NOTES'
          Installs as **TuTak Demo** (`am.tutak.demo`), alongside the real TuTak rather than over it — neither overwrites the other.

          Needs no server: every screen answers from the app's own memory, and any credentials are accepted. No SMS, no sign-in, no API.
          NOTES
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "Built from commit ${{ github.sha }}." >> notes.md

          gh release delete demo-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create demo-latest tutak-demo.apk \
            --title "TuTak Demo (Android)" --notes-file notes.md

      - name: Where to get it
        run: |
          {
            echo "## The demo APK"
            echo ""
            if [ -n "${{ steps.apk.outputs.url }}" ]; then
              echo "**Download (no login):** https://github.com/${{ github.repository }}/releases/download/demo-latest/tutak-demo.apk"
              echo ""
              echo "**From EAS:** ${{ steps.apk.outputs.url }}"
              echo ""
              echo "**On this page:** scroll to **Artifacts** → **tutak-demo-apk**."
            else
              echo "No artifact was produced — the build step above says why."
            fi
            echo ""
            echo "Installs as **TuTak Demo** (\`am.tutak.demo\`), alongside the real app rather than over it."
            echo "It needs no server: every screen answers from memory, any credentials are accepted."
          } >> "$GITHUB_STEP_SUMMARY"
