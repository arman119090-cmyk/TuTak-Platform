# Builds the demonstration app as an installable Android APK.
#
# ## Why this is separate from android-apk.yml
#
# That workflow builds the product, and the product needs an API address —
# a build of it without one installs, opens and reaches nothing. Standing up
# that API is a real piece of work with hosting, a database and a carrier
# behind it.
#
# This builds `demo/`, which answers every request from its own memory. No
# server, no database, no SMS. It is the app somebody taps through to decide
# whether the product is right, and it can exist today rather than after the
# infrastructure does.
#
# ## Why it cannot be mistaken for the product
#
# `demo/` is generated by scripts/build-demo-app.sh and is a separate
# application in every way that a phone can tell: it is called **TuTak Demo**,
# its android package is `am.tutak.demo` against the product's `am.tutak.app`,
# and its URL scheme is `tutakdemo`. Both can be installed at once and neither
# can overwrite the other.
#
# That separation is the point rather than tidiness. This app accepts any
# credentials — that is safe in something plainly labelled a demonstration and
# is an authentication bypass in anything installed as TuTak. The product's own
# config refuses to build with mocks at all (apps/mobile/app.config.js), so the
# two can only ever be built by two different paths.
#
# ## What you need once
#
#   EXPO_TOKEN   repository secret, the same one android-apk.yml uses.
name: Build demo APK

on:
  workflow_dispatch:

concurrency:
  group: demo-apk
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (demo APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse early if the token is missing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenerated rather than taken from the commit, so the APK is built from
      # whatever apps/mobile currently says. A demo that lags the app it
      # demonstrates is worse than no demo — that gap has already shipped once,
      # when demo/ was still carrying a keyboard bug the app had been fixed of.
      - name: Regenerate the demo app from the current source
        run: |
          pnpm install --frozen-lockfile
          scripts/build-demo-app.sh

      - name: Install the demo app's own dependencies
        working-directory: demo
        run: npm install --no-audit --no-fund

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `eas init` can write into a static app.json, which this app has — so
      # unlike the product's dynamic config, the project id needs no
      # environment variable and nothing has to be committed.
      - name: Link the EAS project
        working-directory: demo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --non-interactive --force || true

      - name: Build the APK on EAS
        id: build
        working-directory: demo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          npx eas-cli@latest build \
            --platform android --profile preview \
            --non-interactive --wait --json > build.json 2> build.err || {
              echo "::error::EAS refused or failed the build:"
              tail -40 build.err
              exit 1
            }
          URL=$(node -e "const b=require('./build.json');const r=Array.isArray(b)?b[0]:b;process.stdout.write(r.artifacts?.buildUrl||r.artifacts?.applicationArchiveUrl||'')")
          ID=$(node -e "const b=require('./build.json');const r=Array.isArray(b)?b[0]:b;process.stdout.write(r.id||'')")
          echo "APK_URL: $URL"
          echo "BUILD_ID: $ID"
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download the APK
        if: steps.build.outputs.apk_url != ''
        run: curl -fL -o tutak-demo.apk "${{ steps.build.outputs.apk_url }}"

      - name: Attach the APK to this run
        if: steps.build.outputs.apk_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: tutak-demo-apk
          path: tutak-demo.apk
          retention-days: 30

      - name: Where to get it
        run: |
          {
            echo "## The demo APK"
            echo ""
            if [ -n "${{ steps.build.outputs.apk_url }}" ]; then
              echo "**Direct:** ${{ steps.build.outputs.apk_url }}"
              echo ""
              echo "**On this page:** scroll to **Artifacts** → **tutak-demo-apk**."
            else
              echo "No artifact was produced — the build step above says why."
            fi
            echo ""
            echo "Installs as **TuTak Demo** (\`am.tutak.demo\`), alongside the real app rather than over it."
            echo "It needs no server: every screen answers from memory, any credentials are accepted."
          } >> "$GITHUB_STEP_SUMMARY"
