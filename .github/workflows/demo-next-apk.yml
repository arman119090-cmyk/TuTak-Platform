name: Build TuTak Demo Next APK

on:
  push:
    branches: [demo/android-new-ui-20260817]
    paths:
      - 'demo-next/**'
      - '.github/workflows/demo-next-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: demo-next
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: demo-next
        run: npx expo prebuild --platform android --non-interactive
      - name: Build standalone release APK
        working-directory: demo-next/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Copy APK
        run: cp demo-next/android/app/build/outputs/apk/release/app-release.apk tutak-demo-next-standalone.apk
      - name: Verify standalone APK and bundled JS
        run: |
          test -s tutak-demo-next-standalone.apk
          head -c 2 tutak-demo-next-standalone.apk | grep -q 'PK'
          unzip -l tutak-demo-next-standalone.apk | tee apk-contents.txt
          grep -Eq 'assets/(index.android.bundle|expo-router/.*|.*\.bundle)' apk-contents.txt
          ls -lh tutak-demo-next-standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tutak-demo-next-standalone-apk
          path: tutak-demo-next-standalone.apk
          retention-days: 30
