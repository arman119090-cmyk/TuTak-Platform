# Measures how many hops a deployment's infrastructure adds to
# `X-Forwarded-For`, which is the one number `CLIENT_IP_TRUSTED_HOPS` needs
# and the one number nobody is allowed to guess.
#
# Why a workflow rather than a line in a README: the measurement has to come
# from outside the deployment, over the real edge, from a machine that is not
# the deployment itself. A runner is exactly that, and "Run workflow" is a
# button that works from a phone.
#
# The probe sends `X-Forwarded-For: <marker>` and names that same value in
# `X-TuTak-Proxy-Probe`. The default marker is 203.0.113.7 — TEST-NET-3,
# reserved by RFC 5737 for documentation, so it can never be a real client
# address. Naming it is what lets the API tell the entry the caller wrote
# from the entries its own edge appended: everything to the right of the
# marker is infrastructure, and that count is the answer.
#
# Repeat the measurement with a routable marker before trusting a reading
# that says the edge discarded what was sent: an edge that sanitises
# reserved ranges but forwards routable ones would produce the same line and
# would not be safe.
#
# The API prints the shape of the chain to its own log — positions and counts
# only, never addresses. Read that line on Railway and it names the value to
# set, or says not to use `xff-depth` on this deployment at all.
name: Measure the proxy chain

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'A URL on the deployment to probe. Its liveness endpoint is ideal — e.g. https://your-api-host/health'
        required: true
        type: string
      marker:
        description: 'The address to send as the caller-written X-Forwarded-For entry. Change it to confirm the reading does not depend on the address class — an edge that drops reserved ranges but forwards routable ones would otherwise read as safe when it is not.'
        required: false
        default: '203.0.113.7'
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Send one probe request
        env:
          URL: ${{ inputs.url }}
          MARKER: ${{ inputs.marker }}
        # --fail is deliberately absent: a 4xx/5xx still reached the process,
        # and reaching it is the whole point. The status is printed instead,
        # so a wrong URL is obvious rather than silent.
        run: |
          set -uo pipefail
          echo "Probing $URL"
          status=$(curl --silent --show-error --location \
            --max-time 30 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "X-TuTak-Proxy-Probe: $MARKER" \
            --header "X-Forwarded-For: $MARKER" \
            "$URL") || status="(request failed)"
          echo "HTTP status: $status"
          {
            echo "## Proxy chain probe sent"
            echo ""
            echo "Sent to \`$URL\` with \`X-Forwarded-For: $MARKER\` (one entry)."
            echo "HTTP status: \`$status\`"
            echo ""
            echo "Now read the deployment's log for the line from \`ProxyChain\`."
            echo "It names the \`CLIENT_IP_TRUSTED_HOPS\` value to set, or says not to use"
            echo "\`xff-depth\` on this deployment at all."
          } >> "$GITHUB_STEP_SUMMARY"
