# External uptime detection, with nothing but GitHub.
#
# The API's own alerts are sent by the API process. When that process is not
# running — a migration that failed on boot, a container that never became
# healthy, a platform outage — there is nobody left to send anything. Railway
# restarts the container (restart policy ALWAYS) but tells no human.
#
# This workflow is the outside observer: every ten minutes it runs
# scripts/uptime-probe.sh, which asks `/health/ready` and, with METRICS_TOKEN,
# reads `tutak_ledger_imbalance_amd`, and pages the same webhook the API uses
# (`ALERT_WEBHOOK_URL`) in the same JSON shape. The script's logic is proven
# by scripts/uptime-probe.test.sh, which CI runs on every push.
#
# Paging is transition-based: a long outage pages once when it starts and
# then once an hour, not every ten minutes. The previous run's conclusion
# comes from the Actions API (hence `actions: read`).
#
# Secrets (Settings → Secrets and variables → Actions):
#   ALERT_WEBHOOK_URL  required for a page; without it the run only fails
#                      visibly in the Actions tab (still a signal, weaker).
#   METRICS_TOKEN      optional; same value as the API's METRICS_TOKEN.
# Variables:
#   API_BASE_URL       optional; defaults to the production API below.
#
# GitHub only runs schedules from the default branch, so this is inert until
# it is on `main`; `workflow_dispatch` is the manual proof run after that.
# Ten minutes is GitHub's practical floor for schedules; a check that runs a
# few minutes late is still a check. If GitHub Actions itself is down, so is
# this observer — that is the residual gap, and the Actions status page is
# where it shows.
name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://tutak-api-production.up.railway.app' }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Previous run's conclusion (for transition paging)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion' 2>/dev/null)
          echo "conclusion=${prev:-unknown}" >> "$GITHUB_OUTPUT"
          # A reminder slot: the first probe of every hour re-pages a still-open outage.
          if [ "$(date -u +%M)" -lt 10 ]; then echo "reminder=1" >> "$GITHUB_OUTPUT"; else echo "reminder=0" >> "$GITHUB_OUTPUT"; fi
          echo "previous=${prev:-unknown} reminder=$([ "$(date -u +%M)" -lt 10 ] && echo 1 || echo 0)"

      - name: Probe
        env:
          PAGE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'always' || 'transition' }}
          PREVIOUS_CONCLUSION: ${{ steps.prev.outputs.conclusion }}
          REMINDER: ${{ steps.prev.outputs.reminder }}
        run: bash scripts/uptime-probe.sh
