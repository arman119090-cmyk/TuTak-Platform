name: Cash Out CI

on:
  push:
    paths:
      - 'cash-out/**'
      - '.github/workflows/cash-out-ci.yml'
  pull_request:
    paths:
      - 'cash-out/**'

defaults:
  run:
    working-directory: cash-out

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cashout
          POSTGRES_PASSWORD: cashout
          POSTGRES_DB: cashout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cashout:cashout@127.0.0.1:5432/cashout_test?schema=public
      TEST_DATABASE_URL: postgresql://cashout:cashout@127.0.0.1:5432/cashout_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cash-out/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @cashout/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @cashout/api exec prisma migrate deploy

      - name: Build the shared packages
        run: pnpm -r --filter "./packages/*" build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Check formatting
        run: pnpm format:check
