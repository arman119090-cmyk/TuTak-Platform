# Prometheus alerting rules for Cash Out, over the gauges the API exports at
# GET /metrics (bearer METRICS_TOKEN). The same conditions are evaluated
# inside the process every minute and shown at GET /v1/admin/alerts; this
# file exists so that paging does not depend on the process being alive.
groups:
  - name: cashout-money
    rules:
      - alert: CashOutLedgerImbalance
        expr: cashout_ledger_imbalance_minor != 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Ledger does not balance ({{ $labels.currency }}: {{ $value }})'
          description: 'Debits and credits differ. Stop payouts and investigate before anything else.'
      - alert: CashOutWithdrawalStuck
        expr: cashout_withdrawals_stuck > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: '{{ $value }} withdrawal(s) debited the driver and stopped'
      - alert: CashOutWithdrawalUncertain
        expr: cashout_withdrawals_uncertain > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} withdrawal(s) uncertain for 10 minutes'
      - alert: CashOutCompensationRequired
        expr: cashout_withdrawals_compensation_required > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} withdrawal(s) need the park debit reversed'
      - alert: CashOutReconciliationMismatch
        expr: cashout_reconciliation_mismatches_open > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: '{{ $value }} open reconciliation mismatch(es)'
      - alert: CashOutWorkerLag
        expr: cashout_worker_lag_seconds > 120
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 'Withdrawal worker is {{ $value }}s behind'
      - alert: CashOutWorkerLagCritical
        expr: cashout_worker_lag_seconds > 600
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Withdrawal worker is {{ $value }}s behind — is the worker running?'
      - alert: CashOutAutoPayoutFailures
        expr: cashout_auto_payout_failures_1h > 0 or cashout_auto_payout_rules_paused > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Automatic payouts failing or paused'

  - name: cashout-integrations
    rules:
      - alert: CashOutYandexUnavailable
        expr: cashout_integration_up{integration="yandex-fleet",mode="live"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: 'Yandex Fleet API not answering: balances and debits blocked'
      - alert: CashOutIdramUnavailable
        expr: cashout_integration_up{integration="idram",mode="live"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: 'iDram not answering: payouts cannot be submitted or probed'
      - alert: CashOutSmsUnavailable
        expr: cashout_integration_up{integration="sms",mode="live"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: 'SMS gateway not answering: nobody can sign in'
      - alert: CashOutRedisUnavailable
        expr: cashout_redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Rate-limit Redis unreachable: OTP/PIN/admin sign-in refused or unlimited'
      - alert: CashOutPushUnavailable
        expr: cashout_integration_up{integration="push",mode="live"} == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Push provider not answering; notifications queuing'
      - alert: CashOutMockIntegrationInProduction
        expr: cashout_integration_up{mode="mock",integration=~"yandex-fleet|idram|sms",deployment="production"} >= 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'A money or sign-in integration is a MOCK in production'

  - name: cashout-security-and-queues
    rules:
      - alert: CashOutOtpFailureRateHigh
        expr: cashout_otp_challenges_15m >= 10 and (cashout_otp_challenges_failed_15m / cashout_otp_challenges_15m) >= 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Half of OTP challenges failing: SMS trouble or an attack'
      - alert: CashOutPinFailureRateHigh
        expr: cashout_pin_failures_15m >= 20 or cashout_pin_locked_drivers >= 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Unusual PIN failures ({{ $value }})'
      - alert: CashOutNotificationBacklog
        expr: cashout_notification_backlog >= 100 or cashout_notification_oldest_seconds >= 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Notifications are not being delivered'
      - alert: CashOutMetricsStale
        expr: time() - cashout_metrics_evaluated_timestamp_seconds > 300
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'The API has not evaluated its metrics for 5 minutes'
