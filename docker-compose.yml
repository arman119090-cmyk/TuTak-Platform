name: tutak

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # WAL archiving is on here, in the file people copy onto a server,
    # because turning it on later does not help: point-in-time recovery can
    # only go back as far as the archive, and the archive starts when you
    # switch it on. A database that has been running unarchived for a month
    # can be recovered to "the last nightly dump" and nowhere else.
    #
    # The cost locally is a 16 MB file per filled segment in a volume. The
    # benefit is that the recovery drill (scripts/pitr-rehearse.sh) can be
    # run against this stack rather than only against production.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/tutak-pitr-archive.sh "%p" "%f"
      # replica is already the default and is enough for archive-based PITR;
      # stated so a future edit does not lower it to `minimal`, which makes
      # the archive unusable while everything still appears to work.
      - -c
      - wal_level=replica
    # The archive directory is a named volume, and Docker creates one owned by
    # root — while Postgres runs as `postgres` and cannot write into it. The
    # result is `archive command failed ... Permission denied` on every
    # segment, forever: WAL piles up in pg_wal, the archive stays empty, and
    # point-in-time recovery is a feature that exists only in this file. It
    # had been failing once a second for the life of every CI run, in a log
    # nobody read, which is exactly how a backup turns out not to exist on the
    # day it is needed.
    #
    # The image starts as root and steps down to `postgres` inside
    # docker-entrypoint.sh, so this is the one moment a chown can happen. It
    # warns rather than refuses: a local stack that will not start because of
    # its archive is worse than one that starts and says so.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        chown postgres:postgres /var/lib/tutak/wal-archive 2>/dev/null
        || echo "warning: cannot chown the WAL archive — archiving will fail and PITR will have nothing to restore from" >&2;
        exec docker-entrypoint.sh "$$@"
      - --
    environment:
      POSTGRES_USER: tutak
      POSTGRES_PASSWORD: tutak_dev_password
      POSTGRES_DB: tutak
      # archive_command inherits the postmaster's environment, which is this.
      PITR_ARCHIVE_DIR: /var/lib/tutak/wal-archive
    ports:
      - "5432:5432"
    volumes:
      - tutak_postgres_data:/var/lib/postgresql/data
      # A separate volume on purpose. WAL that lives on the same disk as the
      # data it protects is not a backup of that data — one failed disk takes
      # both. On a real deployment this should be a mount of somewhere else
      # entirely: object storage, another host, anything that does not fail
      # at the same moment.
      - tutak_wal_archive:/var/lib/tutak/wal-archive
      - ./scripts/pitr-archive.sh:/usr/local/bin/tutak-pitr-archive.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutak -d tutak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password-protected even locally. Not because anything can reach this
    # port on a developer's machine, but because this file is the template
    # people copy onto a server — and what Redis holds here is the advisory
    # locks that keep two workers off the same money, the job queue that
    # drives settlement, and the suppression windows that decide whether an
    # alert reaches a human. An unauthenticated Redis on a network someone
    # else can see is all three of those, writable.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-tutak_dev_password}"]
    ports:
      - "6379:6379"
    healthcheck:
      # The ping has to authenticate too, or the container reports healthy
      # while every real client is being refused.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tutak_dev_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Named explicitly rather than left to Compose's project-plus-service
    # derivation, so CI can build the image once and boot that exact image.
    image: tutak-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      # This file describes a local stack — the database password is in the
      # clear a dozen lines above and every port is published to the host.
      # Claiming `production` here was not just inaccurate, it could not
      # start: in production the app deliberately refuses to boot without a
      # real SMS carrier (SmsModule) and a real acquirer (PaymentsModule),
      # both of which are exactly what a local stack does not have. It also
      # switches off Swagger, which is half the point of running this.
      #
      # A real deployment overrides this and supplies both. See
      # docs/DEPLOYMENT.md.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      # Compose's internal DNS resolves these to the containers above — not
      # "localhost", which inside this container would mean the api
      # container itself.
      DATABASE_URL: postgresql://tutak:tutak_dev_password@postgres:5432/tutak?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-tutak_dev_password}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in a .env file — see apps/api/.env.example}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in a .env file — see apps/api/.env.example}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # Off unless asked for. Demo mode opens the passwordless demo sign-in
      # and permits the sandbox acquirer, so it is a deliberate choice rather
      # than something a local stack acquires by accident. The CI job sets it
      # to drive the mobile bundle; see tests/e2e/mobile-demo.e2e.ts.
      DEMO_MODE: ${DEMO_MODE:-false}
      # The demo customer's password, and the flag that seeds them.
      #
      # `DEMO_MODE` alone was not enough and the gap was invisible: the seeder
      # is run with `docker compose exec -e DEMO_PASSWORD=...`, which sets the
      # variable for that one command, so the *running API* never had it. The
      # demo sign-in endpoint reads it at request time, found nothing, and
      # answered 404 — so the button appeared, the tap failed, and the screen
      # said "demo sign-in is not available on this server" against a stack
      # that had just seeded the demo customer.
      #
      # Empty by default: with `DEMO_MODE` off nothing reads it, and a blank
      # value keeps the endpoint refusing rather than guessing.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_SEED: ${DEMO_SEED:-false}
      SMS_ENDPOINT: ${SMS_ENDPOINT:-}
      SMS_AUTH_SCHEME: ${SMS_AUTH_SCHEME:-basic}
      SMS_USERNAME: ${SMS_USERNAME:-}
      SMS_TOKEN: ${SMS_TOKEN:-}
      SMS_SENDER: ${SMS_SENDER:-TuTak}
      SMS_ENCODING: ${SMS_ENCODING:-form}
      FEATURE_QR_LEDGER_MIRROR: ${FEATURE_QR_LEDGER_MIRROR:-false}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_ENDPOINT: ${PUSH_ENDPOINT:-https://exp.host/--/api/v2/push/send}
      PUSH_ACCESS_TOKEN: ${PUSH_ACCESS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Where money-at-risk alerts go. Unset means they are logged and nobody
      # is told; the API boots either way and warns at startup.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # A payout must be confirmed by someone other than its requester.
      PAYOUT_DUAL_CONTROL: ${PAYOUT_DUAL_CONTROL:-true}
      # Bearer token for GET /metrics. Unset leaves the endpoint disabled.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tutak-api}
      # Recurring work: settlement, bonus promotion and expiry, EV cleanup,
      # nightly reconciliation. On by default because a stack where nothing
      # settles looks like a stack where payments do not work. Set it to
      # `false` only to measure something without a drainer competing.
      SWEEPS_ENABLED: ${SWEEPS_ENABLED:-true}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-tutak}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Dashboards ──────────────────────────────────────────────────────────
  #
  # Both talk to the API from the *browser*, not from inside the compose
  # network, so their base URL is the published host port — "api:4000" would
  # resolve only inside Docker and fail in the address bar. Next.js inlines
  # that value at build time, which is why it is a build argument.

  admin:
    image: tutak-admin:latest
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:4000/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  partner:
    image: tutak-partner:latest
    build:
      context: .
      dockerfile: apps/partner/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:4000/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  tutak_postgres_data:
  tutak_wal_archive:
