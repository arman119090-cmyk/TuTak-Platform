<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2FAF5"/><stop offset="1" stop-color="#F7F9F8"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00B676"/><stop offset="1" stop-color="#0B5D3B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#172033" flood-opacity=".09"/></filter>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#172033}.h1{font-size:40px;font-weight:800}.h2{font-size:23px;font-weight:800}.h3{font-size:17px;font-weight:800}.body{font-size:15px;font-weight:500}.small{font-size:13px;font-weight:600}.tiny{font-size:11px;font-weight:600}.muted{fill:#667085}.white{fill:#fff}.green{fill:#009B61}.blue{fill:#2F80ED}.amber{fill:#B65F00}.line{stroke:#E5E7EB;stroke-width:1}.icon{fill:none;stroke:#0B5D3B;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1800" height="1220" fill="url(#bg)"/>
  <text x="90" y="80" class="t h1">TuTak · UI component sheet v2</text>
  <text x="90" y="113" class="t body muted">Точный визуальный язык для Claude: состояния, кнопки, метки и навигация. Текст локализуется в приложении.</text>

  <g transform="translate(90,165)">
    <rect width="510" height="334" rx="26" fill="#fff" filter="url(#shadow)"/>
    <text x="32" y="47" class="t h2">Кнопки и метки</text>
    <text x="32" y="74" class="t small muted">Высота 52–58px · радиус 16px · touch target ≥44px</text>
    <rect x="32" y="96" width="446" height="58" rx="17" fill="url(#brand)"/><text x="255" y="132" text-anchor="middle" class="t h3 white">Сканировать QR</text>
    <rect x="32" y="170" width="216" height="52" rx="16" fill="#fff" stroke="#D0D5DD"/><text x="140" y="202" text-anchor="middle" class="t h3 green">Копировать код</text>
    <rect x="263" y="170" width="215" height="52" rx="16" fill="#DCFCE7"/><text x="370" y="202" text-anchor="middle" class="t h3 green">Поделиться кодом</text>
    <rect x="32" y="238" width="103" height="32" rx="16" fill="#FEF3C7"/><text x="83" y="259" text-anchor="middle" class="t tiny amber">Ожидает</text>
    <rect x="147" y="238" width="126" height="32" rx="16" fill="#DCFCE7"/><text x="210" y="259" text-anchor="middle" class="t tiny green">Подтверждено</text>
    <rect x="285" y="238" width="104" height="32" rx="16" fill="#FEE4E2"/><text x="337" y="259" text-anchor="middle" class="t tiny" fill="#C4322A">Отклонено</text>
    <text x="32" y="306" class="t tiny muted">Не использовать красный для обычных акцентов, навигации или промо.</text>
  </g>

  <g transform="translate(630,165)">
    <rect width="500" height="334" rx="26" fill="#fff" filter="url(#shadow)"/>
    <text x="32" y="47" class="t h2">Поля и фильтры</text>
    <rect x="32" y="80" width="436" height="54" rx="16" fill="#fff" stroke="#D0D5DD"/><circle cx="58" cy="107" r="8" fill="none" stroke="#98A2B3" stroke-width="2"/><path d="M64 113l6 6" stroke="#98A2B3" stroke-width="2" stroke-linecap="round"/><text x="86" y="112" class="t small muted">Поиск адреса или партнёра</text>
    <rect x="32" y="154" width="93" height="34" rx="17" fill="#00B676"/><text x="79" y="176" text-anchor="middle" class="t tiny white">⚡ Станции</text>
    <rect x="137" y="154" width="91" height="34" rx="17" fill="#fff" stroke="#E5E7EB"/><text x="182" y="176" text-anchor="middle" class="t tiny muted">Магазины</text>
    <rect x="240" y="154" width="63" height="34" rx="17" fill="#fff" stroke="#E5E7EB"/><text x="271" y="176" text-anchor="middle" class="t tiny muted">Кафе</text>
    <rect x="315" y="154" width="85" height="34" rx="17" fill="#fff" stroke="#E5E7EB"/><text x="357" y="176" text-anchor="middle" class="t tiny muted">Рестораны</text>
    <text x="32" y="226" class="t h3">Доступные статусы — не только цветом</text>
    <circle cx="46" cy="260" r="9" fill="#00B676"/><text x="64" y="265" class="t body">Доступно</text><circle cx="183" cy="260" r="9" fill="#F59E0B"/><text x="201" y="265" class="t body">Ожидает</text><circle cx="337" cy="260" r="9" fill="#E5484D"/><text x="355" y="265" class="t body">Ошибка</text>
    <text x="32" y="303" class="t tiny muted">Чипы и статусы обязаны иметь подпись и screen-reader label.</text>
  </g>

  <g transform="translate(1160,165)">
    <rect width="550" height="334" rx="26" fill="#fff" filter="url(#shadow)"/>
    <text x="32" y="47" class="t h2">Карты и финансовая ясность</text>
    <rect x="32" y="75" width="486" height="122" rx="21" fill="url(#brand)"/><text x="58" y="107" class="t small white">ДОСТУПНО ДЛЯ СКИДКИ · AMD</text><text x="58" y="151" class="t h1 white">24 800</text><text x="58" y="178" class="t small white" opacity=".84">Зарезервировано: 1 200</text>
    <rect x="32" y="216" width="231" height="80" rx="18" fill="#FFF7ED"/><text x="52" y="244" class="t small muted">Зарезервировано · AMD</text><text x="52" y="277" class="t h2">1 200</text>
    <rect x="287" y="216" width="231" height="80" rx="18" fill="#E9F4FF"/><text x="307" y="244" class="t small muted">Получено всего · AMD</text><text x="307" y="277" class="t h2">39 450</text>
    <text x="32" y="320" class="t tiny muted">Нельзя объединять доступное, зарезервированное и историческое в одно число.</text>
  </g>

  <g transform="translate(90,537)">
    <rect width="790" height="280" rx="26" fill="#fff" filter="url(#shadow)"/>
    <text x="32" y="48" class="t h2">Навигация</text><text x="32" y="74" class="t small muted">QR — единственное центральное действие. Рефералы — яркая точка входа из Главной.</text><text x="32" y="94" class="t small muted">Они не шестая вкладка и не конкурируют с QR.</text>
    <rect x="32" y="113" width="726" height="101" rx="23" fill="#F7F9F8"/>
    <path d="M77 151l12-11 12 11v18H77zM69 151l20-18 20 18" class="icon"/><text x="89" y="197" text-anchor="middle" class="t small green">Главная</text>
    <circle cx="232" cy="153" r="11" fill="none" stroke="#98A2B3" stroke-width="2.5"/><path d="M232 142v11l7 6" fill="none" stroke="#98A2B3" stroke-width="2.5" stroke-linecap="round"/><text x="232" y="197" text-anchor="middle" class="t small muted">Карта</text>
    <circle cx="386" cy="152" r="33" fill="url(#brand)"/><rect x="374" y="140" width="24" height="24" rx="5" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="386" cy="152" r="4" fill="#fff"/><text x="386" y="207" text-anchor="middle" class="t small green">QR</text>
    <path d="M513 142h21l8 10-8 10h-21l-8-10z" fill="none" stroke="#98A2B3" stroke-width="2.5"/><text x="524" y="197" text-anchor="middle" class="t small muted">Кошелёк</text>
    <circle cx="671" cy="146" r="9" fill="none" stroke="#98A2B3" stroke-width="2.5"/><path d="M656 169c2-9 8-14 15-14s13 5 15 14" fill="none" stroke="#98A2B3" stroke-width="2.5" stroke-linecap="round"/><text x="671" y="197" text-anchor="middle" class="t small muted">Профиль</text>
    <rect x="32" y="231" width="726" height="25" rx="12" fill="#DCFCE7"/><text x="395" y="248" text-anchor="middle" class="t tiny green">Главная → «Пригласить друзей» → «Моя сеть»</text>
  </g>

  <g transform="translate(910,537)">
    <rect width="800" height="280" rx="26" fill="#fff" filter="url(#shadow)"/>
    <text x="32" y="48" class="t h2">Рефералы: отображение и приватность</text>
    <rect x="32" y="76" width="226" height="122" rx="18" fill="#DCFCE7"/><text x="52" y="110" class="t h3">Уровень 1 · 1%</text><text x="52" y="136" class="t small">Приглашены лично</text><text x="52" y="163" class="t tiny muted">Имя + инициал, статус, дата</text>
    <rect x="276" y="76" width="226" height="122" rx="18" fill="#E9F4FF"/><text x="296" y="110" class="t h3">Уровень 2 · 0,5%</text><text x="296" y="136" class="t small">Друзья друзей</text><text x="296" y="163" class="t tiny muted">Только агрегированный счётчик</text>
    <rect x="520" y="76" width="248" height="122" rx="18" fill="#FFF7ED"/><text x="540" y="110" class="t h3">Уровень 3 · 0,5%</text><text x="540" y="136" class="t small">Следующий уровень</text><text x="540" y="163" class="t tiny muted">Только агрегированный счётчик</text>
    <text x="32" y="237" class="t small" fill="#C4322A">Нельзя: лица/имена L2–L3, телефоны, email, связи, покупки или начисления других людей.</text>
  </g>

  <g transform="translate(90,855)">
    <rect width="1620" height="250" rx="26" fill="#0B5D3B"/>
    <text x="38" y="50" class="t h2 white">Как Claude должен использовать пакет</text>
    <text x="38" y="82" class="t body white" opacity=".86">1. Открыть все три SVG — это масштабируемые исходники. 2. Сверить PNG — это контроль финального рендера. 3. Реализовать токены и компоненты.</text>
    <text x="38" y="111" class="t body white" opacity=".86">4. Использовать Jako SVG для знака и HD JPG только для Home hero. 5. Не создавать фиктивные фото партнёров и не менять реферальную экономику.</text>
    <rect x="38" y="145" width="316" height="66" rx="18" fill="#fff" opacity=".16"/><text x="61" y="173" class="t h3 white">SVG = исходник</text><text x="61" y="197" class="t tiny white" opacity=".82">без потери качества при масштабировании</text>
    <rect x="376" y="145" width="316" height="66" rx="18" fill="#fff" opacity=".16"/><text x="399" y="173" class="t h3 white">PNG = проверка</text><text x="399" y="197" class="t tiny white" opacity=".82">визуальное совпадение перед merge</text>
    <rect x="714" y="145" width="398" height="66" rx="18" fill="#fff" opacity=".16"/><text x="737" y="173" class="t h3 white">Markdown = точные правила</text><text x="737" y="197" class="t tiny white" opacity=".82">копирайтинг, состояния, приватность</text>
  </g>
  <text x="90" y="1168" class="t tiny muted">Реальные логотипы и фото партнёров добавляются только с подтверждённым источником и лицензией. Конкурентские референсы не включаются.</text>
</svg>
