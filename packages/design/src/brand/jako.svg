<!--
  Jako — the TuTak mark.

  A geometric African Grey in profile, reduced to the four things that
  actually identify the species: the heavy hooked beak, the high domed
  crown, the bare white eye patch, and the scalloped scale-feathering of the
  neck. Everything else is removed.

  The bird is drawn in the neutral ramp because the African Grey genuinely
  is grey — the mascot and the product's "secondary information" palette are
  the same colour, which is why Jako can sit inside an interface without
  competing with it. The single brand-green accent replaces the species'
  red tail: red is reserved for destructive states, so the tail carries the
  brand instead. That one green shape is the only saturated pixel in the
  mark, which makes it read as a logo rather than an illustration.

  Built on a 48×48 grid; legible down to 20px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Jako, the TuTak parrot">
  <!-- tail: the brand accent, angled out of the body -->
  <path d="M17.6 32.4 8.9 41.1a2.1 2.1 0 0 0 1.5 3.6h4.2c1.2 0 2.3-.5 3.1-1.4l4.6-5.2-4.7-5.7Z" fill="#0B5D3B"/>
  <!-- body / wing mass -->
  <path d="M31.6 8.2c-6.9 0-12.6 5.2-13.3 11.9l-.7 6.6a9.9 9.9 0 0 0 2.4 7.6l2.6 2.9a8 8 0 0 0 5.9 2.6h1.9c6.6 0 12-5.4 12-12V20.5c0-6.8-5.4-12.3-12-12.3h1.2Z" fill="#98A2B3"/>
  <!-- crown / head, lighter so the head separates from the body -->
  <path d="M30.4 4.6c-7.1 0-12.9 5.8-12.9 12.9v3.9c0 3 2.4 5.4 5.4 5.4h9.3c5.6 0 10.1-4.5 10.1-10.1v-.7c0-6.3-5.1-11.4-11.4-11.4h-.5Z" fill="#D0D5DD"/>
  <!-- bare white eye patch — the species' most recognisable feature -->
  <ellipse cx="24.6" cy="15.4" rx="4.6" ry="4.9" fill="#FCFCFD"/>
  <circle cx="24.2" cy="15.4" r="2.1" fill="#101828"/>
  <!-- catchlight keeps the eye alive at small sizes -->
  <circle cx="25.1" cy="14.5" r="0.7" fill="#FFFFFF"/>
  <!-- heavy hooked beak -->
  <path d="M18.4 13.9c-3.5.3-6.2 2.4-7.5 5-.5 1-.2 2.2.7 2.8l2.2 1.5c.6.4 1.4.5 2.1.2l3.9-1.6c1-.4 1.6-1.4 1.5-2.4l-.3-3.6a2 2 0 0 0-2.1-1.9h-.5Z" fill="#344054"/>
  <path d="M13.8 23.2c1.5.9 3.4.9 4.9 0l1.4-.9-3.6 1.5c-.7.3-1.5.2-2.1-.2l-.6-.4Z" fill="#1D2939"/>
  <!-- scalloped neck feathering, the grey's signature scale pattern -->
  <path d="M31.4 28.6a2.4 2.4 0 1 1 4.8 0 2.4 2.4 0 0 1-4.8 0ZM25.9 31.9a2.4 2.4 0 1 1 4.8 0 2.4 2.4 0 0 1-4.8 0ZM36.7 32.4a2.4 2.4 0 1 1 4.8 0 2.4 2.4 0 0 1-4.8 0Z" fill="#B6BDC9" opacity=".75"/>
</svg>
