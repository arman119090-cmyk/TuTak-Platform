# TuTak staging on Render.
#
# This blueprint is staging only: no DEMO_MODE, no DEMO_SEED, no fake
# acquirer and no invented business data. Source-map upload for the Next.js
# dashboards is intentionally NOT part of the first staging deployment.
# SENTRY_AUTH_TOKEN must not be configured on any Render runtime service.

databases:
  - name: tutak-staging-db
    databaseName: tutak_staging
    user: tutak
    plan: free
    ipAllowList: []

services:
  - type: keyvalue
    name: tutak-staging-redis
    plan: free
    ipAllowList: []

  - type: web
    name: tutak-staging-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # `production`, not `staging`: this is a network-reachable deployment,
      # and every framework and guard that keys on NODE_ENV must take its
      # production path here. Which deployment it is lives in APP_ENV.
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: PORT
        value: '4000'
      - key: DATABASE_URL
        fromDatabase:
          name: tutak-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tutak-staging-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Bootstrap only: permissions, roles and one temporary super admin.
      # After the first successful login and password rotation, set this to
      # false so the baseline seed no longer runs on container restarts.
      - key: SEED_BASELINE
        value: 'true'
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Where req.ip comes from. Render appends to X-Forwarded-For without
      # stripping what the client sent, so the leftmost entry is forgeable and
      # TRUST_PROXY (which names a proxy address) does not apply. Measure the
      # hop count against the live service before setting these — an
      # over-count selects an attacker-supplied address. Left unset, per-IP
      # OTP limits stand down and the global SMS budget carries the load.
      # See docs/RENDER_STAGING_RU.md.
      - key: CLIENT_IP_STRATEGY
        sync: false
      - key: CLIENT_IP_TRUSTED_HOPS
        sync: false
      # Total messages this service may send, across every flow. The only
      # limit that bounds the carrier bill rather than one attacker's reach.
      - key: SMS_GLOBAL_MAX_PER_HOUR
        sync: false
      - key: SMS_GLOBAL_MAX_PER_DAY
        sync: false
      # Without a carrier every code send fails with a generic
      # "temporarily unavailable" — never a code written to the log.
      - key: SMS_ENDPOINT
        sync: false
      - key: SWEEPS_ENABLED
        value: 'true'
      - key: QUEUE_PREFIX
        value: tutak-staging
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: tutak-staging-admin
    runtime: docker
    plan: free
    dockerfilePath: ./apps/admin/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: APP_ENV
        value: staging
      # Must reach the *build*, not just the running container: it fixes the
      # `connect-src` of the Content-Security-Policy, which no runtime variable
      # can change afterwards. The build now refuses rather than guessing, so a
      # failed build with `ApiBaseUrlNotConfiguredError` means Render did not
      # forward this into the Docker build — see docs/PRODUCTION_RUNBOOK_RU.md
      # §3 for the two ways to supply it. Not a secret; a public API address.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://tutak-staging-api.onrender.com/v1
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: staging
      # No SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT here. Source maps
      # are explicitly disabled for the initial staging build.
      - key: SENTRY_VERIFY_ENABLED
        sync: false
      - key: SENTRY_VERIFY_TOKEN
        generateValue: true

  - type: web
    name: tutak-staging-partner
    runtime: docker
    plan: free
    dockerfilePath: ./apps/partner/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: APP_ENV
        value: staging
      # Must reach the *build*, not just the running container: it fixes the
      # `connect-src` of the Content-Security-Policy, which no runtime variable
      # can change afterwards. The build now refuses rather than guessing, so a
      # failed build with `ApiBaseUrlNotConfiguredError` means Render did not
      # forward this into the Docker build — see docs/PRODUCTION_RUNBOOK_RU.md
      # §3 for the two ways to supply it. Not a secret; a public API address.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://tutak-staging-api.onrender.com/v1
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: staging
      # No SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT here. Source maps
      # are explicitly disabled for the initial staging build.
      - key: SENTRY_VERIFY_ENABLED
        sync: false
      - key: SENTRY_VERIFY_TOKEN
        generateValue: true
